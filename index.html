    <!-- Leads AI Widget Responsiveness Override -->
    <script>
      (function() {
        const targetId = 'leadsai-host';
        const styleContent = `
          :host {
            color-scheme: only light !important;
          }
          .chat-win {
            max-height: calc(100vh - 120px) !important;
            height: 600px !important;
            color-scheme: only light !important;
          }
          .launcher {
            color-scheme: only light !important;
          }
          @media (max-width: 480px) {
            .chat-win {
              width: calc(100vw - 32px) !important;
              height: calc(100vh - 110px) !important;
              max-height: calc(100vh - 110px) !important;
              right: -8px !important;
            }
          }
        `;

        function tryInject() {
          const host = document.getElementById(targetId);
          if (host && host.shadowRoot) {
            host.style.setProperty('color-scheme', 'only light', 'important');
            if (host.shadowRoot.getElementById('leadsai-custom-style')) return true;
            const style = document.createElement('style');
            style.id = 'leadsai-custom-style';
            style.textContent = styleContent;
            host.shadowRoot.appendChild(style);
            return true;
          }
          return false;
        }

        function init() {
          if (!tryInject()) {
            const observer = new MutationObserver((mutations, obs) => {
              if (tryInject()) {
                obs.disconnect();
              }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            setTimeout(() => observer.disconnect(), 15000);
          }
        }

        if (document.body) {
          init();
        } else {
          document.addEventListener('DOMContentLoaded', init);
        }
      })();
    </script>
